[project]
name = "tenderapi-mcp"
version = "0.7.4"
description = "MCP server for TenderAPI: French (BOAMP) and EU (TED) public procurement data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TenderAPI", email = "contact@tenderapi.fr" },
]
keywords = ["mcp", "boamp", "ted", "procurement", "api", "france", "eu"]
dependencies = [
    # mcp 2.0.0 (2026-07-28) a supprime `mcp.server.fastmcp` et remplace FastMCP
    # par MCPServer : l'import de server.py plante a l'installation. Tant que la
    # migration vers l'API 2.x n'est pas faite, on reste sur la ligne 1.x.
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://tenderapi.fr"
Documentation = "https://tenderapi.fr/docs"
Repository = "https://github.com/IDNSIDNS/tenderapi-mcp"
Issues = "https://github.com/IDNSIDNS/tenderapi-mcp/issues"

[project.scripts]
tenderapi-mcp = "tenderapi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tenderapi_mcp"]
