[project]
name = "tenderapi-mcp"
version = "0.8.1"
description = "MCP server for TenderAPI: French (BOAMP) and EU (TED) public procurement data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TenderAPI", email = "contact@tenderapi.fr" },
]
keywords = ["mcp", "boamp", "ted", "procurement", "api", "france", "eu"]
dependencies = [
    # Migre vers l'API MCPServer de mcp 2.x le 2026-08-12. L'epinglage `<2.0.0` pose
    # le 09/08 etait un correctif d'urgence : il rendait le paquet reinstallable, mais
    # au prix d'une RETROGRADATION silencieuse de mcp en 1.29 dans tout environnement
    # ou 2.x etait deja installe — mesure au `pip install --dry-run`. Les versions
    # 0.7.x restent disponibles pour qui doit rester sur la ligne 1.x.
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://tenderapi.fr"
Documentation = "https://tenderapi.fr/docs"
Repository = "https://github.com/IDNSIDNS/tenderapi-mcp"
Issues = "https://github.com/IDNSIDNS/tenderapi-mcp/issues"

[project.scripts]
tenderapi-mcp = "tenderapi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tenderapi_mcp"]
